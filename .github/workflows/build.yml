name: Build Nexus Client

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pokaż strukturę repo
        run: find . -not -path './.git/*' -type f | head -50

      - name: Znajdź projekt
        id: proj
        run: |
          F=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            echo "::error::Nie znaleziono settings.gradle w repo. Wgraj build.gradle, gradle.properties, settings.gradle i folder src/"
            exit 1
          fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-client
          path: ${{ steps.proj.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error

      - name: Release (tylko przy tagu v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.proj.outputs.dir }}/build/libs/*.jar
